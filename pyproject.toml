[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml-challenge-latam"
version = "1.0.2"
authors = [{ name = "Javier Omar Tramon Hidalgo", email = "jotramon@uc.cl" }]
description = "Flight delay prediction on GCP: training and serving pipelines on Cloud Run Jobs, controlled by a FastAPI service"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "db-dtypes>=1,<2",
    "fastapi>=0.100,<1",
    "google-cloud-bigquery>=3,<4",
    "google-cloud-run>=0.16,<1",
    "google-cloud-storage>=2,<3",
    "joblib>=1.3,<2",
    "numpy>=2,<3",
    "pandas>=2.3,<3",
    "protobuf>=4,<8",
    "pyarrow>=23,<24",
    "pydantic>=2,<3",
    "scikit-learn>=1.3,<2",
    "uvicorn>=0.20,<1",
    "xgboost>=1.7.6,<3",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29.5,<7",
    "ipython>=8.15,<9",
    "matplotlib>=3.7,<4",
    "pkginfo>=1.12,<2",
    "ruff>=0.15,<1",
    "safety>=3.8,<4",
    "seaborn>=0.12,<1",
    "twine>=6.2,<7",
    "httpx>=0.28.1",
    "mypy>=1.10,<2",
    "pandas-stubs>=2.2,<3",
]
test = [
    "coverage>=7.14,<8",
    "httpx>=0.23,<1",
    "locust>=2,<3",
    "mockito>=2,<3",
    "pytest>=8.4,<9",
    "pytest-cov>=7,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["challenge"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]

[tool.ruff]
extend-include = ["*.ipynb"]
output-format = "concise"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # pydocstyle
    "D101",
    "D102",
    "D103",
    # Mccabe
    "C90",
    # Pylint
    "PL",
    # Eradicate
    "ERA",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-print
    "T20",
    # Ruff
    "RUF",
]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.mccabe]
max-complexity = 50

[tool.ruff.lint.pycodestyle]
max-line-length = 100

[tool.mypy]
python_version = "3.12"
files = ["challenge"]
ignore_missing_imports = true

# google-cloud-storage ships no py.typed marker; read its sources for types.
[[tool.mypy.overrides]]
module = ["google.cloud.storage", "google.cloud.storage.*"]
follow_untyped_imports = true
